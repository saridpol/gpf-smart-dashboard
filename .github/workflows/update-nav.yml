name: Update GPF NAV

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official GPF NAV
        run: python scripts/fetch_gpf_nav.py
      - name: Commit updated NAV data
        run: |
          if git diff --quiet -- nav-data.json; then
            echo "NAV unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nav-data.json
          git commit -m "Update official GPF NAV data"
          git push
